<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>લેન્ડસ્કેપ માર્ક્સ સ્કેનર</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: black;
            overflow: hidden; color: white; font-family: Arial, sans-serif;
        }
        #scannerUI {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1;
        }
        #videoElement {
            width: 100%; height: 100%; object-fit: cover;
        }
        .target-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            height: 22%;
            border: 4px solid #ff3b30;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
            z-index: 2;
        }
        .grid-lines {
            display: flex; height: 100%; width: 100%;
        }
        .grid-lines div {
            flex: 1;
            border-right: 2.5px solid #ff3b30;
        }
        .grid-lines div:last-child { border: none; }
        .top-bar {
            position: absolute; top: 15px; left: 0; width: 100%;
            z-index: 5; text-align: center; text-shadow: 2px 2px 4px black;
        }
        .controls {
            position: absolute; bottom: 25px; left: 0; width: 100%;
            z-index: 5; display: flex; justify-content: center; gap: 15px;
        }
        .btn-custom {
            padding: 12px 30px; font-size: 1.2rem; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold;
        }
        #previewArea {
            display: none; padding: 20px; z-index: 10;
            position: relative; background: #f8f9fa;
            height: 100vh; color: black; overflow-y: auto;
        }
        .cropped-img {
            border: 3px solid #ff3b30; width: 100%;
            max-width: 800px; margin: 15px 0; border-radius: 5px;
        }

        /* Loading overlay */
        #loadingOverlay {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 1.3rem;
        }
        #loadingOverlay.show { display: flex; }
        .spinner {
            width: 60px; height: 60px;
            border: 6px solid #ffffff44;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Marks result table */
        #marksTable {
            display: none;
            margin-top: 20px;
        }
        .marks-cell {
            width: 60px; height: 50px;
            font-size: 1.4rem; font-weight: bold;
            text-align: center; border: 2px solid #dee2e6;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div>AI ડેટા વાંચી રહ્યું છે...</div>
    <small style="margin-top:8px; color:#ccc;">કૃપા કરી રાહ જુઓ</small>
</div>

<!-- કેમેરા સ્ક્રીન -->
<div id="scannerUI">
    <div class="top-bar">
        <h4 class="fw-bold mb-0">મોબાઈલને આડો (Landscape) પકડો</h4>
        <small>લાલ બોક્સમાં માર્ક્સ સેટ કરો</small>
    </div>

    <video id="videoElement" autoplay playsinline></video>

    <div class="target-box" id="targetBox">
        <div class="grid-lines">
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-warning btn-custom" id="startBtn" onclick="startCamera()">
            📷 કેમેરા ઓન
        </button>
        <button class="btn btn-success btn-custom" id="captureBtn" onclick="captureAndCrop()" disabled>
            📸 સ્કેન કરો
        </button>
    </div>
</div>

<!-- છુપો કેનવાસ -->
<canvas id="hiddenCanvas" style="display:none;"></canvas>

<!-- પરિણામ સ્ક્રીન -->
<div id="previewArea" class="text-center">
    <h3 class="text-primary fw-bold mt-3">📷 ક્રોપ થયેલો ફોટો:</h3>
    <img id="croppedResult" class="cropped-img" src="" alt="Cropped Marks">

    <!-- Marks Table -->
    <div id="marksTable">
        <h4 class="text-success fw-bold">✅ AI દ્વારા વંચાયેલા માર્ક્સ:</h4>
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="marksCells"></div>
        <p class="text-muted small">ખોટા માર્ક્સ હોય તો ટેપ કરીને સુધારો</p>
    </div>

    <!-- Error message -->
    <div id="errorMsg" style="display:none;" class="alert alert-danger mt-3"></div>

    <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
        <button class="btn btn-secondary btn-lg" onclick="location.reload()">🔄 ફરીથી સ્કેન</button>
        <button class="btn btn-primary btn-lg px-5" id="sendBtn" onclick="sendToSheet()" disabled>
            📤 ડેશબોર્ડમાં મોકલો
        </button>
    </div>
</div>

<script>
    // ============================================================
    // ⚙️ અહી તમારી GAS Web App URL પેસ્ટ કરો
    // ============================================================
    const GAS_URL = "અહી_તમારી_GAS_WEB_APP_URL_પેસ્ટ_કરો";
    // ============================================================

    const video   = document.getElementById('videoElement');
    const canvas  = document.getElementById('hiddenCanvas');
    const targetBox = document.getElementById('targetBox');
    let finalImage = null;
    let marksArray = [];

    // ----- Camera Start -----
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                document.getElementById('captureBtn').disabled = false;
                document.getElementById('startBtn').style.display = 'none';
            };
        } catch (err) {
            alert("કેમેરા ચાલુ કરવામાં ભૂલ:\n" + err.message +
                  "\n\nBrowser Settings > Camera > Allow કરો");
        }
    }

    // ----- Capture & Crop -----
    function captureAndCrop() {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const videoRect = video.getBoundingClientRect();
        const boxRect   = targetBox.getBoundingClientRect();

        const scaleX = canvas.width  / videoRect.width;
        const scaleY = canvas.height / videoRect.height;

        const cropX = (boxRect.left - videoRect.left) * scaleX;
        const cropY = (boxRect.top  - videoRect.top)  * scaleY;
        const cropW = boxRect.width  * scaleX;
        const cropH = boxRect.height * scaleY;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width  = cropW;
        cropCanvas.height = cropH;
        cropCanvas.getContext('2d').drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        finalImage = cropCanvas.toDataURL('image/jpeg', 1.0);

        document.getElementById('croppedResult').src = finalImage;
        document.getElementById('scannerUI').style.display = 'none';
        document.getElementById('previewArea').style.display = 'block';

        // Camera stream બંધ
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

        // Auto OCR
        sendImageForOCR(finalImage);
    }

    // ----- OCR via GAS doPost() -----
    function sendImageForOCR(base64Img) {
        document.getElementById('loadingOverlay').classList.add('show');
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('marksTable').style.display = 'none';

        fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Img })
        })
        .then(r => r.json())
        .then(result => {
            document.getElementById('loadingOverlay').classList.remove('show');
            if (result.status === "success") {
                marksArray = result.text.match(/\d+/g) || [];
                showMarksTable(marksArray);
            } else {
                showError("GAS Error: " + result.message);
            }
        })
        .catch(err => {
            document.getElementById('loadingOverlay').classList.remove('show');
            showError("ઇન્ટરનેટ અથવા GAS URL ભૂલ!\n" + err.message);
        });
    }

    // ----- Editable Marks Table -----
    function showMarksTable(arr) {
        const cells = document.getElementById('marksCells');
        cells.innerHTML = '';
        arr.forEach((m, i) => {
            const inp = document.createElement('input');
            inp.type = 'number';
            inp.value = m;
            inp.className = 'marks-cell form-control';
            inp.id = 'mark_' + i;
            cells.appendChild(inp);
        });
        document.getElementById('marksTable').style.display = 'block';
        document.getElementById('sendBtn').disabled = false;
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // ----- Send to Sheet (future) -----
    function sendToSheet() {
        const finalMarks = [];
        marksArray.forEach((_, i) => {
            finalMarks.push(document.getElementById('mark_' + i).value);
        });
        // અહી Sheet ને POST કરવાનો code ઉમેરી શકાય
        alert("✅ માર્ક્સ:\n" + finalMarks.join(" | ") + "\n\n(Sheet integration next step)");
    }
</script>

</body>
</html>
