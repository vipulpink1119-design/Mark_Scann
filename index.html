<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>માર્ક્સ સ્કેનર</title>
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#111; color:#fff; font-family:Arial,sans-serif; height:100dvh; overflow:hidden; display:flex; flex-direction:column; }

.screen { display:none; width:100%; height:100dvh; }
.screen.active { display:flex; flex-direction:column; }

/* HOME */
#s-home { justify-content:center; align-items:center; gap:20px; background:#1a1a2e; }
#s-home h1 { font-size:1.6rem; color:#e0e0e0; text-align:center; }
#s-home p  { color:#999; font-size:.9rem; text-align:center; padding:0 20px; }
.big-btn { padding:16px 40px; font-size:1.2rem; border:none; border-radius:50px; cursor:pointer; font-weight:bold; }
.btn-start { background:#f0a500; color:#000; }
.btn-sheet { background:#34a853; color:#fff; font-size:.95rem; padding:12px 30px; }

/* BARCODE SCREEN */
#s-barcode { position:relative; background:#000; }
#barcode-video-wrap { flex:1; position:relative; overflow:hidden; }
#barcode-video-wrap video, #barcode-video-wrap canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
.barcode-overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-60%); width:80%; max-width:340px; height:90px; border:3px solid #f0a500; border-radius:10px; box-shadow:0 0 0 9999px rgba(0,0,0,.55); z-index:5; pointer-events:none; }
.scan-line { position:absolute; left:4px; right:4px; height:2px; background:#f0a500; animation:scanmove 1.5s linear infinite; z-index:6; }
@keyframes scanmove { 0%{top:8px} 50%{top:calc(100% - 10px)} 100%{top:8px} }
.barcode-info { position:absolute; bottom:14px; width:100%; text-align:center; z-index:10; }
.barcode-info p { font-size:.9rem; color:#ddd; margin-bottom:8px; }
.btn-manual { background:rgba(255,255,255,.15); border:1px solid #fff; color:#fff; padding:8px 22px; border-radius:30px; font-size:.85rem; cursor:pointer; }

/* MARKS CAMERA */
#s-marks { position:relative; background:#000; }
#marks-video-wrap { flex:1; position:relative; overflow:hidden; }
#marks-video-wrap video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
.uid-badge { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.7); border:1.5px solid #f0a500; border-radius:20px; padding:4px 14px; font-size:.85rem; color:#f0a500; z-index:10; }
.marks-target { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:94%; height:28%; border:3px solid #ff3b30; border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.6); z-index:5; pointer-events:none; }
.marks-grid { display:flex; height:100%; }
.marks-grid div { flex:1; border-right:1.5px solid rgba(255,59,48,.6); }
.marks-grid div:last-child { border:none; }
.marks-hint { position:absolute; top:12px; width:100%; text-align:center; z-index:10; text-shadow:1px 1px 4px #000; }
.marks-hint h5 { font-size:.95rem; color:#fff; }
.marks-hint small { font-size:.75rem; color:#ccc; }
.marks-controls { position:absolute; bottom:18px; width:100%; display:flex; justify-content:center; gap:14px; z-index:10; }
.btn-capture { background:#ff3b30; border:none; color:#fff; padding:14px 38px; border-radius:50px; font-size:1.1rem; font-weight:bold; cursor:pointer; }
.btn-retake  { background:rgba(255,255,255,.18); border:1.5px solid #fff; color:#fff; padding:14px 22px; border-radius:50px; font-size:.95rem; cursor:pointer; }

/* VERIFY */
#s-verify { background:#f8f9fa; color:#000; overflow-y:auto; align-items:center; padding:16px; }
#s-verify h4 { font-size:1.1rem; color:#333; margin-bottom:4px; }
.preview-img { width:100%; max-width:700px; border:2px solid #ff3b30; border-radius:8px; margin:10px 0; }
.marks-edit-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; width:100%; max-width:500px; margin:10px 0; }
.mark-inp-wrap { display:flex; flex-direction:column; align-items:center; }
.mark-inp-wrap label { font-size:.7rem; color:#666; margin-bottom:2px; }
.mark-inp { width:100%; height:44px; font-size:1.1rem; font-weight:bold; text-align:center; border:2px solid #ccc; border-radius:8px; background:#fff; }
.mark-inp:focus { border-color:#1a73e8; outline:none; }
.mark-inp.total-inp { border-color:#34a853; background:#f0fff4; }
.uid-show { font-size:1rem; color:#1a73e8; font-weight:bold; margin-bottom:6px; }
.action-row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; width:100%; max-width:500px; }
.btn-save   { background:#1a73e8; color:#fff; border:none; padding:14px 0; border-radius:50px; font-size:1rem; font-weight:bold; cursor:pointer; flex:1; min-width:140px; }
.btn-rescan { background:#fff; color:#333; border:2px solid #ccc; padding:14px 0; border-radius:50px; font-size:.95rem; cursor:pointer; flex:1; min-width:120px; }

/* SPINNER */
#spinner { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:999; justify-content:center; align-items:center; flex-direction:column; color:#fff; font-size:1.1rem; gap:18px; }
#spinner.show { display:flex; }
.spin-circle { width:56px; height:56px; border:5px solid #ffffff33; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* TOAST */
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 26px; border-radius:30px; font-size:.95rem; z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
#toast.show { opacity:1; }
#toast.green { background:#34a853; }
#toast.red   { background:#d93025; }

/* MANUAL MODAL */
#manualModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:900; justify-content:center; align-items:center; }
#manualModal.show { display:flex; }
.modal-box { background:#1a1a2e; border-radius:16px; padding:28px 24px; width:88%; max-width:340px; text-align:center; }
.modal-box h4 { color:#f0a500; margin-bottom:14px; }
.modal-box input { width:100%; padding:12px; font-size:1.2rem; border-radius:10px; border:2px solid #f0a500; background:#111; color:#fff; text-align:center; margin-bottom:14px; }
.modal-box .btn-ok     { background:#f0a500; color:#000; border:none; padding:12px 32px; border-radius:30px; font-size:1rem; font-weight:bold; cursor:pointer; margin-right:8px; }
.modal-box .btn-cancel { background:transparent; color:#aaa; border:1px solid #555; padding:12px 22px; border-radius:30px; font-size:.95rem; cursor:pointer; }
canvas#marksCanvas { display:none; }
</style>
</head>
<body>

<div id="spinner"><div class="spin-circle"></div><span id="spinMsg">AI વાંચી રહ્યું છે...</span></div>
<div id="toast"></div>

<div id="manualModal">
  <div class="modal-box">
    <h4>Student UID દાખલ કરો</h4>
    <input id="manualUID" type="number" placeholder="e.g. 10105" inputmode="numeric">
    <br>
    <button class="btn-ok" onclick="confirmManualUID()">ઓકે</button>
    <button class="btn-cancel" onclick="closeModal()">રદ</button>
  </div>
</div>

<!-- SCREEN 1: HOME -->
<div id="s-home" class="screen active">
  <h1>📋 માર્ક્સ સ્કેનર</h1>
  <p>સ્ટીકર ઉપરનો બારકોડ સ્કેન કરો,<br>પછી માર્ક્સ ફોટો લો — ડેટા Sheet માં!</p>
  <button class="big-btn btn-start" onclick="goTo('s-barcode'); startBarcodeScanner()">📷 સ્કેન શરૂ કરો</button>
  <button class="big-btn btn-sheet" onclick="openSheet()">📊 Google Sheet ખોલો</button>
</div>

<!-- SCREEN 2: BARCODE -->
<div id="s-barcode" class="screen">
  <div id="barcode-video-wrap">
    <div class="barcode-overlay"><div class="scan-line"></div></div>
  </div>
  <div class="barcode-info">
    <p>સ્ટીકરનો <strong>બારકોડ</strong> પીળા બોક્સમાં રાખો</p>
    <button class="btn-manual" onclick="showManual()">UID જાતે દાખલ કરો</button>
  </div>
</div>

<!-- SCREEN 3: MARKS CAMERA -->
<div id="s-marks" class="screen">
  <div id="marks-video-wrap">
    <video id="marksVideo" autoplay playsinline></video>
    <div class="uid-badge">UID: <span id="uidDisplay">-</span></div>
    <div class="marks-hint">
      <h5>ફોન <strong>આડો (Landscape)</strong> રાખો</h5>
      <small>લાલ બોક્સ → Q1 થી Q13 + TOTAL ખાના</small>
    </div>
    <div class="marks-target">
      <div class="marks-grid">
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
    </div>
    <div class="marks-controls">
      <button class="btn-retake"  onclick="goHome()">← પાછા</button>
      <button class="btn-capture" onclick="captureMarks()">📸 Capture</button>
    </div>
  </div>
</div>
<canvas id="marksCanvas"></canvas>

<!-- SCREEN 4: VERIFY -->
<div id="s-verify" class="screen">
  <h4>✅ AI દ્વારા વંચાયેલ ડેટા</h4>
  <div class="uid-show">Student UID: <span id="verifyUID">-</span></div>
  <img id="previewImg" class="preview-img" src="" alt="Preview">
  <div class="marks-edit-grid" id="marksGrid"></div>
  <div class="action-row">
    <button class="btn-rescan" onclick="rescan()">🔄 ફરીથી સ્કેન</button>
    <button class="btn-save"   onclick="saveToSheet()">💾 Sheet માં Save</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const GAS_URL   = "https://script.google.com/macros/s/AKfycbyTmyycCpn_8OpyrFI50rtnFSITpF8qGkvrhhsVaI85eGTHc5ZyfwhCEMZmKRWyoubj/exec";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1ExZ5ipOcpvE8nUWYVJWXtF0uvJn6TN98MJT_32JL9RE/edit?usp=drivesdk";
const Q_LABELS  = ["Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8","Q9","Q10","Q11","Q12","Q13","TOTAL"];

// ── STATE ────────────────────────────────────────────────
let currentUID    = null;
let marksStream   = null;
let croppedB64    = null;
let detectedMarks = [];

// ── NAVIGATION ───────────────────────────────────────────
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { stopMarksCamera(); Quagga.stop(); goTo('s-home'); }
function openSheet() { window.open(SHEET_URL, '_blank'); }

// ── SCREEN 2: BARCODE ────────────────────────────────────
function startBarcodeScanner() {
  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: document.getElementById('barcode-video-wrap'),
      constraints: { facingMode:"environment", width:{ideal:1280}, height:{ideal:720} }
    },
    decoder: { readers: ["code_128_reader","ean_reader"] },
    locate: true
  }, err => {
    if (err) { showToast("Camera Error: " + err.message,'red'); return; }
    Quagga.start();
  });
  Quagga.onDetected(data => {
    const code = data.codeResult.code;
    if (!code) return;
    Quagga.stop();
    currentUID = code;
    showToast("✅ UID: " + code,'green');
    setTimeout(() => startMarksScan(), 600);
  });
}

// ── MANUAL UID ───────────────────────────────────────────
function showManual()  { document.getElementById('manualModal').classList.add('show'); document.getElementById('manualUID').value=''; document.getElementById('manualUID').focus(); }
function closeModal()  { document.getElementById('manualModal').classList.remove('show'); }
function confirmManualUID() {
  const v = document.getElementById('manualUID').value.trim();
  if (!v) { showToast("UID ખાલી!","red"); return; }
  Quagga.stop();
  currentUID = v;
  closeModal();
  showToast("UID: " + v,'green');
  setTimeout(() => startMarksScan(), 500);
}

// ── SCREEN 3: MARKS CAMERA ───────────────────────────────
async function startMarksScan() {
  goTo('s-marks');
  document.getElementById('uidDisplay').textContent = currentUID;
  try {
    marksStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:"environment", width:{ideal:1920}, height:{ideal:1080} }
    });
    document.getElementById('marksVideo').srcObject = marksStream;
  } catch(e) { showToast("Camera Error: " + e.message,'red'); }
}
function stopMarksCamera() {
  if (marksStream) { marksStream.getTracks().forEach(t => t.stop()); marksStream = null; }
}

function captureMarks() {
  const video  = document.getElementById('marksVideo');
  const canvas = document.getElementById('marksCanvas');
  const target = document.querySelector('.marks-target');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);

  const vR = video.getBoundingClientRect();
  const bR = target.getBoundingClientRect();
  const sx = canvas.width  / vR.width;
  const sy = canvas.height / vR.height;
  const cx = (bR.left - vR.left) * sx;
  const cy = (bR.top  - vR.top)  * sy;
  const cw = bR.width  * sx;
  const ch = bR.height * sy;

  const crop = document.createElement('canvas');
  crop.width = cw; crop.height = ch;
  crop.getContext('2d').drawImage(canvas, cx,cy,cw,ch, 0,0,cw,ch);
  croppedB64 = crop.toDataURL('image/jpeg', 0.95);
  stopMarksCamera();
  sendForOCR(croppedB64);
}

// ── OCR via GAS ──────────────────────────────────────────
function sendForOCR(b64) {
  showSpinner("AI વાંચી રહ્યું છે...");
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'ocr', image:b64, uid:currentUID })
  })
  .then(r => r.json())
  .then(res => {
    hideSpinner();
    if (res.status === 'success') {
      detectedMarks = parseMarks(res.text);
      showVerify();
    } else {
      showToast("Error: " + res.message,'red');
      rescan();
    }
  })
  .catch(e => { hideSpinner(); showToast("Network Error: " + e.message,'red'); rescan(); });
}

function parseMarks(text) {
  let nums = (text.match(/\d+/g) || []).map(Number);
  while (nums.length < 14) nums.push('');
  return nums.slice(0,14);
}

// ── SCREEN 4: VERIFY ─────────────────────────────────────
function showVerify() {
  goTo('s-verify');
  document.getElementById('verifyUID').textContent = currentUID;
  document.getElementById('previewImg').src = croppedB64;
  const grid = document.getElementById('marksGrid');
  grid.innerHTML = '';
  Q_LABELS.forEach((lbl,i) => {
    const wrap = document.createElement('div');
    wrap.className = 'mark-inp-wrap';
    const label = document.createElement('label');
    label.textContent = lbl;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.inputMode = 'numeric';
    inp.className = 'mark-inp' + (lbl==='TOTAL' ? ' total-inp' : '');
    inp.id = 'mk_' + i;
    inp.value = (detectedMarks[i] !== undefined && detectedMarks[i] !== '') ? detectedMarks[i] : '';
    if (lbl !== 'TOTAL') inp.addEventListener('input', autoTotal);
    wrap.appendChild(label); wrap.appendChild(inp);
    grid.appendChild(wrap);
  });
  autoTotal();
}

function autoTotal() {
  let sum = 0;
  for (let i = 0; i < 13; i++) {
    sum += parseFloat(document.getElementById('mk_'+i)?.value) || 0;
  }
  const tot = document.getElementById('mk_13');
  if (tot && tot !== document.activeElement) tot.value = sum;
}

function rescan() { stopMarksCamera(); startMarksScan(); }

// ── SAVE TO SHEET ────────────────────────────────────────
function saveToSheet() {
  const marks = Q_LABELS.map((_,i) => document.getElementById('mk_'+i)?.value || '');
  showSpinner("Sheet માં Save...");
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'save', uid:currentUID, marks:marks })
  })
  .then(r => r.json())
  .then(res => {
    hideSpinner();
    if (res.status === 'success') {
      showToast("✅ Saved! UID: " + currentUID,'green');
      setTimeout(() => { currentUID=null; goTo('s-barcode'); startBarcodeScanner(); }, 1400);
    } else { showToast("Save Error: " + res.message,'red'); }
  })
  .catch(e => { hideSpinner(); showToast("Network Error: " + e.message,'red'); });
}

// ── HELPERS ──────────────────────────────────────────────
function showSpinner(msg) { document.getElementById('spinMsg').textContent = msg||'...'; document.getElementById('spinner').classList.add('show'); }
function hideSpinner()    { document.getElementById('spinner').classList.remove('show'); }
function showToast(msg,type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show '+(type||'');
  setTimeout(() => { t.className=''; }, 2800);
}
</script>
</body>
</html>
